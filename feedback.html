<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — AniDub India</title>
  <meta name="description" content="Share your feedback, suggestions, or report issues with AniDub India." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --surface: #16161f;
      --surface2: #1e1e2c;
      --border: #2a2a3d;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-soft: rgba(124,58,237,0.15);
      --text: #e2e2f0;
      --text-muted: #8888aa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,13,20,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 60px;
    }
    .nav-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-logo span { color: var(--text); }
    .nav-links { display: flex; gap: 20px; margin-left: auto; }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); }

    /* ── Page header ── */
    .page-header {
      padding: 40px 24px 0;
      max-width: 800px;
      margin: 0 auto;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .page-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* ── Form container ── */
    .form-wrap {
      max-width: 800px;
      margin: 32px auto 60px;
      padding: 0 24px;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .form-card iframe {
      width: 100%;
      min-height: 720px;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
      .page-header { padding: 28px 16px 0; }
      .form-wrap { padding: 0 16px; margin-top: 24px; }
      .form-card iframe { min-height: 820px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">AniDub<span> India</span></a>
  <div class="nav-links">
    <a href="index.html">Dub Library</a>
    <a href="schedule.html">Airing Now</a>
    <a href="feedback.html" class="active">Feedback</a>
    <a href="submit.html">Add a Dub</a>
  </div>
</nav>

<div class="page-header">
  <h1>Feedback</h1>
  <p>Have a suggestion, spotted an error, or want to request a dub to be added? Let us know — every response helps make AniDub India better.</p>
</div>

<div class="form-wrap">
  <div class="form-card">
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSfQK4kizZDcGZ11ajUAl71oC-ETQO-Ly7kdnjNB2hDP6Z0EzQ/viewform?embedded=true"
      title="AniDub India Feedback Form"
      loading="lazy">
      Loading form…
    </iframe>
  </div>
</div>

</body>
</html>
