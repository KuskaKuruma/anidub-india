<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAL ID Lookup — AniDub India</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d14;
      --surface: #16161f;
      --surface2: #1e1e2c;
      --border: #2a2a3d;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --text: #e2e2f0;
      --text-muted: #8888aa;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,20,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px; height: 60px;
    }
    .nav-logo { font-size: 1.2rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .nav-logo span { color: var(--text); }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; }
    .nav-link:hover { color: var(--text); }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .note { color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin-bottom: 22px; }
    .note strong { color: var(--text); }
    .search-row { display: flex; gap: 10px; margin-bottom: 22px; }
    input[type=text] {
      flex: 1; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 12px 18px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 0.92rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { color: var(--text-muted); margin-bottom: 16px; font-size: 0.9rem; }
    .status.error { color: var(--red); }
    .result {
      display: flex; gap: 16px; align-items: flex-start;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }
    .result img { width: 72px; height: 102px; object-fit: cover; border-radius: 6px; background: var(--surface2); flex-shrink: 0; }
    .result h2 { font-size: 1.02rem; margin-bottom: 2px; }
    .sub { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 10px; }
    .ids { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .mal {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(34,197,94,0.12); color: var(--green);
      border: 1px solid rgba(34,197,94,0.35); border-radius: 8px;
      padding: 6px 10px; font-weight: 700;
    }
    .anilist {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 0.82rem;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    }
    .copy {
      padding: 4px 10px; font-size: 0.78rem; border-radius: 6px;
      background: transparent; color: var(--green); border: 1px solid rgba(34,197,94,0.4);
    }
    .missing { color: var(--yellow); font-size: 0.85rem; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Ani<span>Dub</span> India</a>
  <a class="nav-link" href="admin.html">Admin</a>
</nav>
<main>
  <h1>MAL ID lookup</h1>
  <p class="note">
    The number stored as <strong>MAL ID</strong> is the MyAnimeList anime number, the one in a link like
    <strong>myanimelist.net/anime/38000</strong>. AniList has a different ID. This page searches AniList by title
    and shows the MyAnimeList number to paste into Add Anime.
  </p>
  <form class="search-row" id="form">
    <input type="text" id="title" placeholder="Anime name, e.g. Demon Slayer" autocomplete="off" />
    <button type="submit" id="go">Search</button>
  </form>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>
<script>
  const form = document.getElementById('form');
  const titleInput = document.getElementById('title');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const button = document.getElementById('go');

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const search = titleInput.value.trim();
    resultsEl.innerHTML = '';
    if (!search) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Enter an anime name.';
      return;
    }

    button.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = 'Searching AniList…';

    const query = `
      query ($search: String) {
        Page(perPage: 8) {
          media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
            id
            idMal
            format
            episodes
            title { romaji english native }
            coverImage { large }
            startDate { year }
          }
        }
      }
    `;

    try {
      const response = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ query, variables: { search } })
      });
      const json = await response.json();
      if (!response.ok || json.errors) {
        throw new Error(json.errors?.[0]?.message || 'AniList search failed');
      }
      const media = json.data?.Page?.media || [];
      if (!media.length) {
        statusEl.textContent = 'No anime found for that name.';
        return;
      }
      statusEl.textContent = `${media.length} match${media.length === 1 ? '' : 'es'}. Copy the green MAL ID into Add Anime.`;
      resultsEl.innerHTML = media.map(item => {
        const title = item.title.english || item.title.romaji || item.title.native || 'Untitled';
        const extra = [item.title.romaji, item.title.native].filter(name => name && name !== title).join(' · ');
        const meta = [item.format, item.startDate?.year, item.episodes ? `${item.episodes} eps` : ''].filter(Boolean).join(' · ');
        const mal = item.idMal
          ? `<span class="mal">MAL ID ${item.idMal} <button type="button" class="copy" data-id="${item.idMal}">Copy</button></span>`
          : `<span class="missing">No MyAnimeList ID on this entry</span>`;
        return `<article class="result">
          <img src="${esc(item.coverImage?.large || '')}" alt="" />
          <div>
            <h2>${esc(title)}</h2>
            <div class="sub">${esc([extra, meta].filter(Boolean).join(' — '))}</div>
            <div class="ids">
              ${mal}
              <span class="anilist">AniList ID ${item.id}</span>
            </div>
          </div>
        </article>`;
      }).join('');
    } catch (error) {
      statusEl.className = 'status error';
      statusEl.textContent = error.message || 'Search failed.';
    } finally {
      button.disabled = false;
    }
  });

  resultsEl.addEventListener('click', async (event) => {
    const copy = event.target.closest('.copy');
    if (!copy) return;
    try {
      await navigator.clipboard.writeText(copy.dataset.id);
      copy.textContent = 'Copied';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
    } catch {
      copy.textContent = copy.dataset.id;
    }
  });
</script>
</body>
</html>
